name: Deploy website to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check deployment authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret with Account / Cloudflare Pages / Edit permission, then re-run this workflow."
            exit 1
          fi

      - name: Validate website
        run: |
          node --check dist/main.js
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/downloads/myBody-0.6.0.part1
          test -s dist/downloads/myBody-0.6.0.part2
          test -s dist/downloads/myBody-0.6.0.part3

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b448ebe487f5cf29a0f38e26e90c62d5
          wranglerVersion: '4.152.0'
          command: pages deploy dist --project-name=mybodysite --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check production website
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://mybodysite.pages.dev/ --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://mybodysite.pages.dev/styles.css --output /dev/null
          curl --fail --silent --show-error --head --retry 5 --retry-delay 5 --retry-all-errors https://mybodysite.pages.dev/downloads/myBody-0.6.0.part1 --output /dev/null
          echo "Published and checked: https://mybodysite.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
